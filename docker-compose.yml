version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: sol-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - sol-network

  mongo-express:
    image: mongo-express:1.0.0
    container_name: sol-mongo-express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongodb:27017/
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin123
    depends_on:
      - mongodb
    networks:
      - sol-network

volumes:
  mongodb_data:

networks:
  sol-network:
    driver: bridge